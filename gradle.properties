# Gradle forks a daemon regardless of org.gradle.daemon=false, so the loopback problem is
# solved by the short TEMP path in build.ps1 rather than by avoiding the fork. Given the
# fork happens anyway, it needs a real heap: Compose compilation plus in-process KSP will
# thrash the GC at the 1.5g default and die with "the JVM garbage collector is thrashing".
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# Keeps Kotlin compilation inside the Gradle daemon instead of spawning yet another
# process that needs its own loopback connection.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
